name: Android CI (Security & Build)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Dependency Review
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> local.properties
        echo "XAI_API_KEY=${{ secrets.XAI_API_KEY }}" >> local.properties
        echo "SAMBANOVA_API_KEY=${{ secrets.SAMBANOVA_API_KEY }}" >> local.properties
        echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
        echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" >> local.properties
        echo "MAPBOX_DOWNLOADS_TOKEN=${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}" >> local.properties
        echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" >> local.properties
        echo "GMAIL_EMAIL=${{ secrets.GMAIL_EMAIL }}" >> local.properties
        echo "GMAIL_PASSWORD=${{ secrets.GMAIL_PASSWORD }}" >> local.properties

    - name: Create google-services.json
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
        else
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "smartgrow-ci",
              "storage_bucket": "smartgrow-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.example.smartgrow"
                  }
                },
                "api_key": [
                  {
                    "current_key": "dummy-key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Run Security Lint
      run: ./gradlew lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest
